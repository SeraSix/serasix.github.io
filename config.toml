baseURL = "http://localhost:1313/"
defaultContentLanguage = "en"
defaultContentLanguageInSubdir = false
title = "Sera's Portfolio"

# 中英文菜单指向各自语言的栏目页。
[languages.zh]
  languageCode = "zh-CN"
  languageName = "中文"
  weight = 1
  [[languages.zh.menus.main]]
    name = "关于"
    pageRef = "/about"
    weight = 1
  [[languages.zh.menus.main]]
    name = "博客"
    pageRef = "/posts"
    weight = 2
  [[languages.zh.menus.main]]
    name = "项目"
    pageRef = "/projects"
    weight = 3

[languages.en]
  languageCode = "en-US"
  languageName = "English"
  weight = 2
  [[languages.en.menus.main]]
    name = "About"
    pageRef = "/about"
    weight = 1
  [[languages.en.menus.main]]
    name = "Blog"
    pageRef = "/posts"
    weight = 2
  [[languages.en.menus.main]]
    name = "Project"
    pageRef = "/projects"
    weight = 3

[markup]
  [markup.highlight]
    noClasses = false
  [markup.goldmark]
    [markup.goldmark.extensions.passthrough]
      enable = true
      [markup.goldmark.extensions.passthrough.delimiters]
        block = [['$$', '$$']]
        inline = [['$', '$']]
    [markup.goldmark.parser]
      wrapStandAloneImageWithinParagraph = false
      [markup.goldmark.parser.attribute]
        block = true
    [markup.goldmark.renderer]
      unsafe = true
