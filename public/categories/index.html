<!DOCTYPE html>
<html lang="en-us">
<head>
  <meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="X-UA-Compatible" content="ie=edge">
<title>Categories | My Portfolio</title>
<link rel="stylesheet" href="/css/custom.css">
<style>
  .markdown-body img,
  .markdown-body video {
    display: block;
    max-width: 100%;
    height: auto;
    margin: 1.5rem 0;
    border-radius: 12px;
  }

  .markdown-body video {
    width: 100%;
    background: #000;
  }

  .markdown-body table {
    width: 100%;
    border-collapse: collapse;
    margin: 1.5rem 0;
    overflow: hidden;
    background: #fff;
  }

  .markdown-body th,
  .markdown-body td {
    padding: 0.75rem 1rem;
    border: 1px solid #d9e2ec;
    text-align: left;
    vertical-align: top;
  }

  .markdown-body th {
    background: #f0f4f8;
  }

  .markdown-body blockquote {
    margin: 1.5rem 0;
    padding: 1rem 1.25rem;
    border-left: 4px solid #486581;
    background: #f8fbff;
    color: #243b53;
  }

  .markdown-body .callout {
    margin: 1.5rem 0;
    padding: 1rem 1.25rem;
    border-radius: 12px;
    border: 1px solid #bcccdc;
    background: #f8fbff;
  }

  .markdown-body .callout-title {
    margin: 0 0 0.5rem;
    font-size: 0.9rem;
    font-weight: 700;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }

  .markdown-body pre {
    overflow-x: auto;
  }
</style>

</head>
<body style="margin:0; min-height:100vh; display:flex; flex-direction:column; font-family: Arial, sans-serif; color:#1f2933; background-color:#f5f7fa;">
  <header style="background-color:#0f172a; color:#ffffff;">
  <div style="max-width: 960px; margin: 0 auto; padding: 20px; display:flex; justify-content:space-between; align-items:center; gap:20px;">

      My Portfolio
    </a>
    <nav style="display:flex; gap:16px; font-size:14px;">
      
        <a href="/" style="color:#ffffff; text-decoration:none;">Home</a>
      
        <a href="/posts/" style="color:#ffffff; text-decoration:none;">Blog</a>
      
        <a href="/projects/" style="color:#ffffff; text-decoration:none;">Project</a>
      
    </nav>
  </div>
</header>

  <main style="flex:1; width:100%; max-width: 960px; margin: 0 auto; padding: 32px 20px 48px; box-sizing:border-box;">
    
  <section class="list-hero">
    <h1 class="list-title">Categories</h1>
    <div class="list-description"></div>
  </section>

  <section class="content-grid">
    
  </section>

  <footer style="border-top:1px solid #d9e2ec; background-color:#ffffff;">

    <p style="margin:0;">&copy; 2026 My Portfolio. Built with Hugo.</p>
  </div>
</footer>
