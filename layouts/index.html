{{ define "main" }}
  <section style="background-color:#ffffff; border:1px solid #d9e2ec; border-radius:16px; padding:32px; margin-bottom:24px;">
    <h1 style="margin:0 0 16px; font-size:44px;">{{ .Title }}</h1>
    <div style="font-size:18px; line-height:1.8;">{{ .Content }}</div>
  </section>

  {{ $items := where site.RegularPages "Section" "in" (slice "posts" "projects") }}
  {{ range $items.ByDate.Reverse }}
    <article style="background-color:#ffffff; border:1px solid #d9e2ec; border-radius:12px; margin:0 0 16px; padding:20px;">
      <div style="display:flex; justify-content:space-between; align-items:center; gap:16px; margin-bottom:8px;">
        <span style="display:inline-block; padding:4px 10px; border-radius:999px; background-color:#e0e8f9; color:#243b53; font-size:12px; font-weight:700; text-transform:uppercase;">
          {{ .Section }}
        </span>
        <span style="color:#7b8794; font-size:14px;">{{ dateFormat "January 2, 2006" .Date }}</span>
      </div>
      <h2 style="margin:0 0 8px; font-size:26px;">
        <a href="{{ .RelPermalink }}" style="color:#102a43; text-decoration:none;">{{ .Title }}</a>
      </h2>
      <p style="margin:0; font-size:16px; line-height:1.7;">{{ .Summary }}</p>
    </article>
  {{ end }}
{{ end }}
