<header class="site-header">
  <div class="site-header__inner">
    <a href="{{ `/` | relURL }}" class="site-header__brand">
      <img src="{{ `/icons/home.png` | relURL }}" alt="Home" width="30" height="30" class="site-header__brand-icon">
      <span>Home</span>
    </a>
    <nav class="site-header__nav">
      {{ range .Site.Menus.main }}
        {{ if ne .Name "Home" }}
          <a href="{{ .URL | relURL }}" class="site-header__link">{{ .Name }}</a>
        {{ end }}
      {{ end }}
    </nav>
  </div>
</header>
