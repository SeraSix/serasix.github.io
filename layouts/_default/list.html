{{ define "main" }}
  <section style="margin-bottom: 32px;">
    <h1 style="margin:0 0 16px; font-size:40px;">{{ .Title }}</h1>
    <div style="font-size:18px; line-height:1.7;">{{ .Content }}</div>
  </section>

  {{ range .Pages }}
    <article style="background-color:#ffffff; border:1px solid #d9e2ec; border-radius:12px; margin:0 0 16px; padding:20px;">
      <h2 style="margin:0 0 8px; font-size:24px;">
        <a href="{{ .RelPermalink }}" style="color:#102a43; text-decoration:none;">{{ .Title }}</a>
      </h2>
      <div style="color:#7b8794; font-size:14px; margin-bottom:12px;">{{ dateFormat "January 2, 2006" .Date }}</div>
      <p style="margin:0; font-size:16px; line-height:1.7;">{{ .Summary }}</p>
    </article>
  {{ end }}
{{ end }}
