{{ define "main" }}
  <section class="list-hero">
    <h1 class="list-title">{{ .Title }}</h1>
    <div class="list-description">{{ .Content }}</div>
  </section>

  <section class="section-content-grid">
    {{ range .Pages.ByDate.Reverse }}
      {{ partial "card.html" . }}
    {{ end }}
  </section>
{{ end }}
