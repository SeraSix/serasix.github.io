<!DOCTYPE html>
<html lang="{{ site.LanguageCode | default `en-us` }}">
<head>
  {{ partial "head.html" . }}
</head>
<body style="margin:0; min-height:100vh; display:flex; flex-direction:column; font-family: Arial, sans-serif; color:#A9A9B3; background-color:#292A2D;">
  {{ partial "header.html" . }}
  <main style="flex:1; width:100%; max-width: 960px; margin: 0 auto; padding: 32px 20px 48px; box-sizing:border-box;">
    {{ block "main" . }}{{ end }}
  </main>
  {{ partial "footer.html" . }}
</body>
</html>
