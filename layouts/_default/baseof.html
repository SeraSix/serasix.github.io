<!DOCTYPE html>
<html lang="{{ site.LanguageCode | default `en-us` }}">
<head>
  {{ partial "head.html" . }}
</head>
<body style="margin:0; font-family: Arial, sans-serif; color:#1f2933; background-color:#f5f7fa;">
  {{ partial "header.html" . }}
  <main style="max-width: 960px; margin: 0 auto; padding: 32px 20px 48px;">
    {{ block "main" . }}{{ end }}
  </main>
  {{ partial "footer.html" . }}
</body>
</html>
