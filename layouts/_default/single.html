{{ define "main" }}
  <article style="background-color:#ffffff; border:1px solid #d9e2ec; border-radius:16px; padding:32px;">
    <h1 style="margin:0 0 12px; font-size:42px;">{{ .Title }}</h1>
    <div style="color:#7b8794; font-size:14px; margin-bottom:24px;">
      <span>{{ dateFormat "January 2, 2006" .Date }}</span>
      {{ if .Params.author }}<span> | Author: {{ .Params.author }}</span>{{ end }}
    </div>
    <div style="font-size:18px; line-height:1.8;">{{ .Content }}</div>
  </article>
{{ end }}
