{{ define "main" }}
  <div class="single-layout">
    <article class="single-article">
      <div class="single-section-wrap">
        <span class="single-section-badge">{{ .Section }}</span>
      </div>

      <h1 class="single-title">{{ .Title }}</h1>

      <div class="single-meta">
        <span>{{ dateFormat "January 2, 2006" .Date }}</span>
        {{ if .Params.author }}<span> | Author: {{ .Params.author }}</span>{{ end }}
      </div>

      <div class="markdown-body">
        {{ .Content }}
      </div>
    </article>

    <aside class="single-toc">
      <h2 class="single-toc-title">On This Page</h2>
      <div class="single-toc-body">
        {{ .TableOfContents }}
      </div>
    </aside>
  </div>
{{ end }}
