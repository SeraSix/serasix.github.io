{{ define "main" }}
  <style>
    .single-layout {
      display: flex;
      gap: 24px;
      align-items: flex-start;
    }

    .single-article {
      flex: 1;
      min-width: 0;
      background-color: #ffffff;
      border: 1px solid #d9e2ec;
      border-radius: 16px;
      padding: 32px;
    }

    .single-toc {
      width: 260px;
      flex-shrink: 0;
      position: sticky;
      top: 24px;
      background-color: #ffffff;
      border: 1px solid #d9e2ec;
      border-radius: 16px;
      padding: 20px;
    }

    @media (max-width: 1000px) {
      .single-layout {
        display: block;
      }

      .single-toc {
        display: none;
      }
    }
  </style>

  <div class="single-layout">
    <article class="single-article">
      <div style="margin-bottom:12px;">
        <span style="display:inline-block; padding:4px 10px; border-radius:999px; background-color:#e0e8f9; color:#243b53; font-size:12px; font-weight:700; text-transform:uppercase;">
          {{ .Section }}
        </span>
      </div>

      <h1 style="margin:0 0 12px; font-size:42px;">{{ .Title }}</h1>

      <div style="color:#7b8794; font-size:14px; margin-bottom:24px;">
        <span>{{ dateFormat "January 2, 2006" .Date }}</span>
        {{ if .Params.author }}<span> | Author: {{ .Params.author }}</span>{{ end }}
      </div>

      <div class="markdown-body" style="font-size:18px; line-height:1.8;">
        {{ .Content }}
      </div>
    </article>

    <aside class="single-toc">
      <h2 style="margin:0 0 12px; font-size:18px; color:#102a43;">On This Page</h2>

      <div style="font-size:14px; line-height:1.8; color:#486581;">
        {{ .TableOfContents }}
      </div>
    </aside>
  </div>
{{ end }}
